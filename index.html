<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uma Musume BR Wiki</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&family=Nunito:wght@700;800;900&display=swap');

    :root {
      --primary-green: #68bd28;
      --primary-dark: #4b8f17;
      --tracen-gold: #f3a812;
      --bg-color: #f3f1e9;
      --card-bg: #ffffff;
      --text-color: #4a3423;
      --border-color: #d8d3c3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }

    body { 
      background: linear-gradient(to bottom, rgba(243, 241, 233, 0.35), rgba(243, 241, 233, 0.50)),
                  url('imagens/tracen_bg.png') center/cover no-repeat fixed;
      color: var(--text-color); 
      padding: 20px; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header { text-align: center; margin: 10px auto 20px auto; display: flex; flex-direction: column; align-items: center; }
    .site-logo { max-width: 420px; width: 88%; height: auto; filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.25)); }

    .subtitle {
      font-weight: 900; color: #3e2817; background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(4px); padding: 6px 18px; border-radius: 20px;
      border: 2px solid #e2dec8; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-top: 12px; font-size: 0.95rem;
    }

    .search-container { max-width: 600px; margin: 0 auto 30px auto; display: flex; gap: 12px; align-items: center; }
    .search-box { flex: 1; position: relative; }
    .search-box input {
      width: 100%; padding: 12px 20px 12px 45px; font-size: 1rem; font-weight: 800;
      color: var(--text-color); background: #fff; border: 3px solid var(--primary-green);
      border-radius: 30px; outline: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
    }
    .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); }
    .char-counter { background: #fff; border: 3px solid #dcd7c5; padding: 10px 18px; border-radius: 25px; font-weight: 900; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; max-width: 1100px; margin: 0 auto; width: 100%; }

    .card-mini {
      background: var(--card-bg); border-radius: 20px; padding: 14px 16px;
      box-shadow: 0 6px 0px #ded8c4; border: 3px solid #e2dec8; display: flex; align-items: center;
      gap: 14px; cursor: pointer; position: relative; overflow: hidden; transition: transform 0.15s;
    }
    .card-mini:hover { transform: translateY(-4px); }
    .card-mini::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: var(--primary-green); }

    .avatar-frame { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #e5e0cf; overflow: hidden; flex-shrink: 0; }
    .avatar-frame img { width: 100%; height: 100%; object-fit: cover; }
    .mini-info h3 { font-size: 1.15rem; font-weight: 900; }
    .mini-info p { font-size: 0.85rem; font-weight: 700; color: #786250; }
    .mini-info .click-hint { display: inline-block; margin-top: 4px; font-weight: 900; font-size: 0.78rem; }

    /* MODAL */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(3px); display: none; justify-content: center; align-items: center; padding: 20px; z-index: 1000; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: var(--card-bg); border-radius: 24px; padding: 28px; max-width: 850px; width: 95%; max-height: 90vh; overflow-y: auto; border: 5px solid #e8e3d3; position: relative; }
    .close-btn { position: absolute; top: 18px; right: 18px; background: #ff4757; color: white; border: 3px solid #ffffff; width: 36px; height: 36px; border-radius: 50%; font-weight: 900; cursor: pointer; }

    .modal-header-banner { background: linear-gradient(135deg, var(--primary-green), var(--primary-dark)); color: white; padding: 14px 20px; border-radius: 14px; font-size: 1.5rem; font-weight: 900; margin-bottom: 18px; }
    .info-group { margin-bottom: 9px; font-size: 0.98rem; font-weight: 700; }
    .info-group b { color: #2b1a0e; font-weight: 900; }
    .section-title { background: var(--primary-green); color: white; font-size: 0.95rem; font-weight: 900; padding: 6px 14px; border-radius: 8px; margin: 18px 0 10px 0; }
    .curiosidades { background: #ffffff; padding: 14px 16px; border-radius: 12px; margin-top: 12px; border: 2px solid var(--border-color); }
    .curiosidades ul { padding-left: 20px; margin-top: 8px; font-size: 0.92rem; font-weight: 700; line-height: 1.5; }

    .artes-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 10px; }
    .arte-card { background: #fff; border: 3px solid #d1cdb8; border-radius: 14px; padding: 10px; text-align: center; cursor: pointer; }
    .arte-img-box { width: 100%; height: 260px; border: 2px solid #e2dec8; border-radius: 10px; overflow: hidden; display: flex; justify-content: center; align-items: center; background: #fcfbf9; margin-bottom: 10px; }
    .arte-img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .arte-label { background: #fff; border: 2px solid #d1cdb8; border-radius: 8px; padding: 6px 0; font-weight: 900; color: #4a2e18; }

    /* TEMAS COLORIDOS */
    .theme-blue::before { background: #0284c7 !important; }
    .theme-blue .click-hint { color: #0284c7 !important; }
    .theme-blue-banner, .theme-blue-section { background: #0284c7 !important; }

    .theme-green::before { background: #5ae144 !important; }
    .theme-green .click-hint { color: #5ae144 !important; }
    .theme-green-banner, .theme-green-section { background: #5ae144 !important; }

    .theme-cyan::before { background: #0ea5e9 !important; }
    .theme-cyan .click-hint { color: #0ea5e9 !important; }
    .theme-cyan-banner, .theme-cyan-section { background: #0ea5e9 !important; }

    .theme-indigo::before { background: #4f46e5 !important; }
    .theme-indigo .click-hint { color: #4f46e5 !important; }
    .theme-indigo-banner, .theme-indigo-section { background: #4f46e5 !important; }

    .theme-pink::before { background: #ff5eba !important; }
    .theme-pink .click-hint { color: #ff5eba !important; }
    .theme-pink-banner, .theme-pink-section { background: #ff5eba !important; }

    /* LIGHTBOX */
    .image-modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.9); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
    .image-modal-overlay.active { display: flex; }
    .image-modal-content { max-width: 85vw; max-height: 85vh; object-fit: contain; }
    .close-image-btn { position: absolute; top: 20px; right: 25px; background: #ff4757; color: white; border: 2px solid white; font-size: 1.3rem; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; font-weight: 900; }
    .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255, 255, 255, 0.25); color: white; border: 2px solid rgba(255,255,255,0.6); font-size: 1.8rem; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; }
    .prev-btn { left: 20px; } .next-btn { right: 20px; }

    footer { text-align: center; margin-top: 40px; padding-bottom: 10px; }
    .credit-tag { display: inline-block; background: #ffffff; color: var(--primary-dark); border: 3px solid var(--primary-green); padding: 8px 22px; border-radius: 25px; font-weight: 900; font-size: 0.95rem; }
  </style>
</head>
<body>

  <header>
    <img src="imagens/logo.png" alt="Uma Musume BR Wiki" class="site-logo">
    <p class="subtitle">Wiki e Banco de Dados Oficial de Personagens</p>
  </header>

  <div class="search-container">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" onkeyup="filterCards()" placeholder="Pesquisar por nome, dubladora...">
    </div>
    <div class="char-counter" id="charCounter">Total: 0</div>
  </div>

  <div class="grid" id="characterGrid"></div>
  <div id="modalsContainer"></div>

  <div class="image-modal-overlay" id="imageModal" onclick="closeImageModalOnBg(event)">
    <button class="close-image-btn" onclick="closeImageModal()">✕</button>
    <button class="nav-btn prev-btn" onclick="changeImage(-1)">❮</button>
    <img class="image-modal-content" id="expandedImg" alt="Arte Ampliada">
    <button class="nav-btn next-btn" onclick="changeImage(1)">❯</button>
  </div>

  <footer>
    <div class="credit-tag">Desenvolvido por @Thiagobaoo 🐴✨</div>
  </footer>

  <!-- CARREGA O BANCO DE DADOS SEPARADO -->
  <script src="characters.js"></script>

  <script>
    // GERADOR AUTOMÁTICO DE CARDS E MODAIS
    function renderWiki() {
      const grid = document.getElementById('characterGrid');
      const modals = document.getElementById('modalsContainer');
      grid.innerHTML = '';
      modals.innerHTML = '';

      // Ordena de A a Z
      charactersData.sort((a, b) => a.name.localeCompare(b.name));

      charactersData.forEach(c => {
        // Criar Card Mini
        grid.innerHTML += `
          <div class="card-mini ${c.theme}" data-name="${c.searchTerms}" onclick="openModal('modal-${c.id}')">
            <div class="avatar-frame"><img src="${c.icon}" alt="${c.name}"></div>
            <div class="mini-info">
              <h3>${c.name}</h3>
              <p><b>Dubladora:</b> ${c.voice}</p>
              <span class="click-hint">Clique para ver mais ➔</span>
            </div>
          </div>
        `;

        // Criar Galeria HTML
        let galleryHTML = c.gallery.map((g, idx) => `
          <div class="arte-card" onclick="openGalleryModal('galeria-${c.id}', ${idx})">
            <div class="arte-img-box"><img src="${g.img}" alt="${g.label}"></div>
            <div class="arte-label">${g.label}</div>
          </div>
        `).join('');

        // Criar Curiosidades HTML
        let curiositiesHTML = c.curiosidades.map(item => `<li>${item}</li>`).join('');

        // Criar Modal Completo
        modals.innerHTML += `
          <div class="modal-overlay" id="modal-${c.id}" onclick="closeModalOnBg(event, 'modal-${c.id}')">
            <div class="modal-content">
              <button class="close-btn" onclick="closeModal('modal-${c.id}')">✕</button>
              <div class="modal-header-banner ${c.theme}-banner"><span>${c.name}</span></div>
              <div class="info-group" style="margin-bottom: 12px; font-style: italic; color: #555;"><b>Introdução:</b> "${c.intro}"</div>
              <div class="info-group"><b>Dubladora:</b> ${c.voice}</div>
              <div class="info-group"><b>Aniversário:</b> ${c.birthday}</div>
              <div class="info-group"><b>Altura:</b> ${c.height} | <b>Peso:</b> ${c.weight}</div>
              <div class="info-group"><b>Tamanho do pé:</b> ${c.shoeSize}</div>
              <div class="info-group"><b>Colega de Quarto:</b> ${c.roommate}</div>
              <div class="info-group"><b>Escolaridade:</b> ${c.education}</div>
              
              <div class="section-title ${c.theme}-section"><span>Medidas</span></div>
              <div class="info-group"><b>Busto:</b> ${c.bust} | <b>Cintura:</b> ${c.cintura} | <b>Quadril:</b> ${c.quadril}</div>

              <div class="section-title ${c.theme}-section"><span>Perfil e Habilidades</span></div>
              <div class="info-group"><b>Ponto Forte:</b> ${c.strengths}</div>
              <div class="info-group"><b>Ponto Fraco:</b> ${c.weaknesses}</div>
              <div class="info-group"><b>Cauda:</b> ${c.tail}</div>
              <div class="info-group"><b>Orelhas:</b> ${c.ears}</div>

              <div class="curiosidades">
                <b>Curiosidades:</b>
                <ul>${curiositiesHTML}</ul>
              </div>

              <div class="section-title ${c.theme}-section"><span>Umamusume Artes</span></div>
              <div class="artes-container" id="galeria-${c.id}">${galleryHTML}</div>
            </div>
          </div>
        `;
      });

      updateCharCounter();
    }

    function updateCharCounter() {
      let cards = document.getElementsByClassName('card-mini');
      let visibleCount = 0;
      for (let i = 0; i < cards.length; i++) {
        if (cards[i].style.display !== "none") visibleCount++;
      }
      document.getElementById('charCounter').innerText = `Total: ${visibleCount}`;
    }

    function filterCards() {
      let input = document.getElementById('searchInput').value.toLowerCase();
      let cards = document.getElementsByClassName('card-mini');
      for (let i = 0; i < cards.length; i++) {
        let name = cards[i].getAttribute('data-name');
        cards[i].style.display = name.includes(input) ? "flex" : "none";
      }
      updateCharCounter();
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    function closeModalOnBg(event, id) { if (event.target.classList.contains('modal-overlay')) closeModal(id); }

    let currentGalleryImages = [];
    let currentImageIndex = 0;

    function openGalleryModal(galleryId, index) {
      let container = document.getElementById(galleryId);
      let imgs = container.getElementsByTagName('img');
      currentGalleryImages = [];
      for (let i = 0; i < imgs.length; i++) currentGalleryImages.push(imgs[i].src);
      currentImageIndex = index;
      document.getElementById('expandedImg').src = currentGalleryImages[currentImageIndex];
      document.getElementById('imageModal').classList.add('active');
    }

    function changeImage(direction) {
      currentImageIndex += direction;
      if (currentImageIndex < 0) currentImageIndex = currentGalleryImages.length - 1;
      else if (currentImageIndex >= currentGalleryImages.length) currentImageIndex = 0;
      document.getElementById('expandedImg').src = currentGalleryImages[currentImageIndex];
    }

    function closeImageModal() { document.getElementById('imageModal').classList.remove('active'); }
    function closeImageModalOnBg(event) { if (event.target.classList.contains('image-modal-overlay')) closeImageModal(); }

    document.addEventListener('keydown', function(event) {
      let modal = document.getElementById('imageModal');
      if (modal.classList.contains('active')) {
        if (event.key === 'ArrowLeft') changeImage(-1);
        else if (event.key === 'ArrowRight') changeImage(1);
        else if (event.key === 'Escape') closeImageModal();
      }
    });

    window.addEventListener('DOMContentLoaded', renderWiki);
  </script>

</body>
</html>
